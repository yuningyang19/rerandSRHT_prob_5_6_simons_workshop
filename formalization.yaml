version: "v0.4"
project:
  name: "Subspace embeddings with the rerandomized SRHT"
  description: >-
    A Lean 4 formalization of a rerandomized SRHT subspace embedding theorem.
    For every ambient Walsh dimension n = 2^m, rank 1 <= r <= n, and
    0 < epsilon < 1, one deterministic width k <= min(n, ceil(C r / epsilon^2))
    can be chosen independently of the orthonormal frame. For each fixed frame,
    the transform with two independent uniform sign layers and an independent
    uniform k-subset has spectral failure probability at most 1/100, and
    preserves all squared norms in that subspace within 1 +/- epsilon with
    probability at least 99/100. C is an explicit universal constant, with no
    sharp numerical value claimed. The Comparator selects the spectral theorem
    and its fixed-frame squared-norm consequence. The full repository retains
    the 12 named v6 results and their supporting proofs and correspondence maps.
  authors: ["Yuning Yang"]
  responsible_maintainers: ["Yuning Yang"]
  license: "Apache-2.0"

