  - title: "Subspace embeddings with the rerandomized SRHT"
    authors: ["Yuning Yang"]
    id: "https://github.com/yuningyang19/rerandSRHT_prob_5_6_simons_workshop/blob/d0276b4b5bb85e25a43e6f677356dd625a19c1d6/research/problem_5_6/formalization/v6_certification/revisions/20260907_positive_dimensions/snapshots/research/problem_5_6/paper/v6/main.tex"
    type: "paper"
    location: "Frozen v6 paper f279b6fac180125dce81a82d824da971bb7ae715, Theorem 1 and its squared-norm interpretation"
    relationship: "formalizes"
    note: >-
      The link is a public byte-identical snapshot of the frozen paper. The
      source TeX retains its original empty author field; Yuning Yang supplied
      the author name for this metadata. The independent current three-way
      correspondence map and exact source hashes are included in the repository.
  - title: "Linear Systems and Eigenvalue Problems: Open Questions from a Simons Workshop"
    id: "https://arxiv.org/abs/2602.05394v3"
    type: "paper"
    location: "Definitions 5.1 and 5.3 and Problem 5.6"
    relationship: "background"
    note: >-
      Source of the motivating open question and the rerandomized transform.
      The submitted theorem concerns the without-replacement model specified
      in the frozen v6 paper; prior results and proof sources are cited there.

